[project]
name = "gdpirate"
version = "0.1.0"
description = "Anonymous Google Drive link ingestion foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "websockets>=12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
gdpirate = "gdpirate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdpirate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
